{{- if .Values.prometheusrule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "base-chart.fullname" . }}
  namespace: {{ if .Values.prometheusrule.prometheus }}{{ .Values.prometheusrule.prometheus.namespace | default .Release.Namespace }}{{ else }}{{ .Release.Namespace }}{{ end }}
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
    {{- if .Values.prometheusrule.prometheus }}
    {{- if .Values.prometheusrule.prometheus.labels }}
    {{- toYaml .Values.prometheusrule.prometheus.labels | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  groups:
    {{- range .Values.prometheusrule.groups }}
    - name: {{ .name }}
      rules:
        {{- range .rules }}
        - expr: {{ .expr }}
          {{- if .labels }}
          labels:
          {{- toYaml .labels | nindent 12 }}
          {{- end }}
          alert: {{ .alert }}
          for: {{ .for }}
          {{- if .annotations }}
          annotations:
            {{- toYaml .annotations | nindent 12 }}
          {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
