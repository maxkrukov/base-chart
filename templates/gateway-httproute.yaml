{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "base-chart.fullname" . }}
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if .Values.gateway.parentRefs }}
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- else }}
    - name: {{ include "base-chart.fullname" . }}
  {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.gateway.rules }}
    {{- toYaml .Values.gateway.rules | nindent 4 }}
  {{- else }}
    - backendRefs:
        - name: {{ include "base-chart.fullname" . }}
          {{- $svc := first .Values.service.services }}
          port: {{ if $svc }}{{ $svc.port | default 80 }}{{ else }}80{{ end }}
  {{- end }}
{{- end }}
