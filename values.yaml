# Default values for base-chart.
# This file declares variables to be passed into your templates.

# -- Global overrides
nameOverride: ""
fullnameOverride: ""

# -- Replica configuration (ignored if autoscaling is enabled)
replicaCount: 1

# -- Pod restart policy (Force pods to be recreated by setting a random annotation)
recreatePods: false

# -- Image configuration
image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
# - name: my-registry-secret

# -- Workload Type Configuration (Deployment vs StatefulSet)
statefulset:
  enabled: false
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  volumeClaimTemplates:
    enabled: false
    templates:
      - name: sts-data
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: ""
        storage: 1Gi
        mountPath: /mnt/data

# -- Pod Configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
# prometheus.io/scrape: "true"
# prometheus.io/port: "80"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # runAsUser: 1000
  # readOnlyRootFilesystem: true

terminationGracePeriodSeconds: 30

# -- Container Lifecycle & Probes
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 30"]

startupProbe: {}
#  httpGet:
#    path: /healthz
#    port: http
#  failureThreshold: 30
#  periodSeconds: 10

livenessProbe: {}
#  httpGet:
#    path: /healthz
#    port: http

readinessProbe: {}
#  httpGet:
#    path: /ready
#    port: http

# -- Container Command & Arguments
command: []
# - "nginx"
# - "-g"
# - "daemon off;"
args: []

# -- Environment Variables
env: {}
#  MY_VAR: "my-value"
#  DATABASE_URL: "postgres://user:pass@host:5432/db"

environment: []
#  - name: MY_NODE_NAME
#    valueFrom:
#      fieldRef:
#        fieldPath: spec.nodeName
#  - name: SECRET_PASSWORD
#    valueFrom:
#      secretKeyRef:
#        name: mysecret
#        key: password

envFrom: []
#  - configMapRef:
#      name: app-config
#  - secretRef:
#      name: app-secret

wrapped_env:
  enabled: false
  type: Secret # or ConfigMap
  data: {}
  # DB_PASSWORD: "plain-text-will-be-wrapped-in-secret"

# -- Java/JMX Options (Specific helpers)
JAVA_OPTS: []
# - "-Xmx1024m"
# - "-Xms512m"
JMX_OPTS: []
# - "-Dcom.sun.management.jmxremote"

# -- Files & Storage
files: []
#  - mountPath: /etc/config/app.yaml
#    data:
#      app.yaml: |
#        server:
#          port: 8080
binaryFiles: []
#  - mountPath: /etc/config/logo.png
#    data:
#      logo.png: "base64-encoded-data-here"

fileLoad:
  enabled: false
  mountPath: /app/config # Path where files from chart 'config/' directory will be mounted

volumeMounts: []
#  - name: data
#    mountPath: /data

# -- Scheduling & Affinity
nodeSelector: {}
#  disktype: ssd

tolerations: []
#  - key: "example-key"
#    operator: "Exists"
#    effect: "NoSchedule"

affinity: {}
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#      - matchExpressions:
#        - key: kubernetes.io/e2e-az-name
#          operator: In
#          values:
#          - e2e-az1

# -- Init Containers & Sidecars
initContainers: ""
# |-
# - name: init-db
#   image: busybox
#   command: ['sh', '-c', 'echo "init..."']

sidecars: ""
# |-
# - name: log-exporter
#   image: fluentd

# -- Networking
service:
  type: ClusterIP
  services:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

ingress:
  enabled: false
  className: ""
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          servicePort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

gateway:
  enabled: false
  create: false
  className: cilium
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  hostnames: []
  #  - "app.example.com"
  rules: []
  #  - matches:
  #      - path: { type: PathPrefix, value: /api }
  #    backendRefs:
  #      - name: my-service
  #        port: 80

# -- Observability
servicemonitor:
  enabled: false
  port: http
  path: /metrics
  interval: 10s
  scrapeTimeout: 10s
  # prometheus:
  #   namespace: monitoring
  #   labels:
  #     release: kube-prometheus-stack

prometheusrule:
  enabled: false
  groups: []
  #  - name: app-alerts
  #    rules:
  #      - alert: HighCPU
  #        expr: sum(rate(container_cpu_usage_seconds_total[1m])) > 0.8
  # prometheus:
  #   namespace: monitoring
  #   labels:
  #     release: kube-prometheus-stack

# -- Scaling & Resources
resources: {}
#  limits:
#    cpu: 100m
#    memory: 128Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers: []
