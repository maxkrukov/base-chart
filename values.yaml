# Default values for base-chart.
# This file declares variables to be passed into your templates.

# @section Global

# -- Override the chart name
nameOverride: ""
# -- Override the full chart name
fullnameOverride: ""
# -- Number of replicas (ignored if autoscaling is enabled)
replicaCount: 1
# -- Force pods to be recreated by setting a random annotation
recreatePods: false

# @section Image

image:
  # -- Image repository
  repository: nginx
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion)
  tag: "latest"

# -- Secrets for pulling images from a private registry
imagePullSecrets: []
# - name: my-registry-secret

# @section Workload

statefulset:
  # -- Enable StatefulSet instead of Deployment
  enabled: false
  # -- Pod management policy
  podManagementPolicy: Parallel
  # -- Update strategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  volumeClaimTemplates:
    # -- Enable volume claim templates for StatefulSet
    enabled: false
    # -- List of volume claim templates
    templates:
      - name: sts-data
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: ""
        storage: 1Gi
        mountPath: /mnt/data

# @section Pod

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Pod annotations
podAnnotations: {}
# prometheus.io/scrape: "true"
# prometheus.io/port: "80"

# -- Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context
securityContext: {}
  # runAsUser: 1000
  # readOnlyRootFilesystem: true

# -- Pod termination grace period in seconds
terminationGracePeriodSeconds: 30

# @section Lifecycle & Probes

# -- Container lifecycle hooks
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 30"]

# -- Startup probe configuration
startupProbe: {}
#  httpGet:
#    path: /healthz
#    port: http
#  failureThreshold: 30
#  periodSeconds: 10

# -- Liveness probe configuration
livenessProbe: {}
#  httpGet:
#    path: /healthz
#    port: http

# -- Readiness probe configuration
readinessProbe: {}
#  httpGet:
#    path: /ready
#    port: http

# @section Command & Args

# -- Container command
command: []
# - "nginx"
# - "-g"
# - "daemon off;"

# -- Container arguments
args: []

# @section Environment

# -- Environment variables (key-value)
env: {}
#  MY_VAR: "my-value"
#  DATABASE_URL: "postgres://user:pass@host:5432/db"

# -- Advanced environment variables (valueFrom)
environment: []
#  - name: MY_NODE_NAME
#    valueFrom:
#      fieldRef:
#        fieldPath: spec.nodeName

# -- Load environment variables from Secrets or ConfigMaps
envFrom: []
#  - configMapRef:
#      name: app-config

# -- Helper for wrapping sensitive values in a Secret/ConfigMap
wrapped_env:
  enabled: false
  type: Secret # or ConfigMap
  data: {}
  # DB_PASSWORD: "plain-text-will-be-wrapped-in-secret"

# @section Java/JMX

# -- Java options (JAVA_OPTS)
JAVA_OPTS: []
# - "-Xmx1024m"

# -- JMX options (JMX_OPTS)
JMX_OPTS: []
# - "-Dcom.sun.management.jmxremote"

# @section Files & Storage

# -- Mount files from values
files: []
#  - mountPath: /etc/config/app.yaml
#    data:
#      app.yaml: |
#        server:
#          port: 8080

# -- Mount binary files from values (base64)
binaryFiles: []

# -- Load files from 'config/' directory of the chart
fileLoad:
  enabled: false
  mountPath: /app/config

# -- Additional volume mounts
volumeMounts: []
#  - name: data
#    mountPath: /data

# @section Scheduling

# -- Node selector
nodeSelector: {}
#  disktype: ssd

# -- Tolerations
tolerations: []
#  - key: "example-key"
#    operator: "Exists"

# -- Affinity
affinity: {}

# @section Sidecars

# -- Init containers (template string)
initContainers: ""

# -- Sidecar containers (template string)
sidecars: ""

# @section Networking

service:
  # -- Service type
  type: ClusterIP
  # -- List of service ports
  services:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

ingress:
  # -- Enable Ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          servicePort: 80
  # -- Ingress TLS configuration
  tls: []

gateway:
  # -- Enable Gateway API support
  enabled: false
  # -- Create a Gateway resource
  create: false
  # -- GatewayClass name
  className: cilium
  # -- Parent references for HTTPRoute
  parentRefs: []
  # -- Hostnames for HTTPRoute
  hostnames: []
  # -- Rules for HTTPRoute
  rules: []

# @section Observability

servicemonitor:
  # -- Enable Prometheus ServiceMonitor
  enabled: false
  # -- Service port to scrape
  port: http
  # -- Metrics path
  path: /metrics
  # -- Scrape interval
  interval: 10s
  # -- Scrape timeout
  scrapeTimeout: 10s
  # prometheus:
  #   namespace: monitoring
  #   labels: {}

prometheusrule:
  # -- Enable PrometheusRule
  enabled: false
  # -- Alerting rules groups
  groups: []
  # prometheus:
  #   namespace: monitoring
  #   labels: {}

# @section Scaling & Resources

# -- Container resource requests and limits
resources: {}
#  limits:
#    cpu: 100m
#    memory: 128Mi
#  requests:
#    cpu: 100m
#    memory: 128Mi

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

keda:
  # -- Enable KEDA Autoscaling
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  # -- KEDA triggers
  triggers: []
